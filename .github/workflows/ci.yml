name: POMAK CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Keep the newest PR verification; do not cancel production/main checks.
concurrency:
  group: pomak-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Oxlint (no warnings allowed)
        run: npm run lint -- --deny-warnings
      - run: npm run build
      - name: Verify checked-in Capacitor native plugin wiring
        run: |
          npx cap sync android
          git diff --exit-code -- android/capacitor.settings.gradle android/app/capacitor.build.gradle
      - name: Audit production dependencies (must remain free of moderate+ advisories)
        run: npm audit --omit=dev --audit-level=moderate
      - name: List development dependency advisories (informational)
        run: |
          npm audit --json > audit.json || true
          node -e 'const d=require("./audit.json"); for (const [name,v] of Object.entries(d.vulnerabilities||{})) console.log(name+" "+v.severity+" range="+v.range+" fix="+JSON.stringify(v.fixAvailable)); console.log("Totals:",JSON.stringify(d.metadata?.vulnerabilities||{}));'
        continue-on-error: true
      - name: Chromium offline PWA navigation smoke
        run: |
          # Install the test-only browser driver in isolation. Running npm install
          # in the app root would re-resolve unrelated dev dependencies and can
          # fail for transient/withdrawn tarballs (e.g. oxlint), despite npm ci passing.
          mkdir -p "$RUNNER_TEMP/pomak-playwright"
          npm install --prefix "$RUNNER_TEMP/pomak-playwright" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          ln -s "$RUNNER_TEMP/pomak-playwright/node_modules/playwright" node_modules/playwright
          CHROME_PATH="$(command -v google-chrome)" node scripts/pwa-offline-smoke.mjs

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pomak
          POSTGRES_PASSWORD: pomak_ci_only
          POSTGRES_DB: pomak_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pomak -d pomak_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: github-actions-ci-not-production-secret
      DEBUG: 'False'
      ALLOWED_HOSTS: testserver,localhost
      DATABASE_URL: postgres://pomak:pomak_ci_only@localhost:5432/pomak_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Validate Vercel HTTPS, HSTS and trusted proxy policy
        env:
          VERCEL: '1'
          # This is a CI-only key; actual production secret stays in Vercel.
          SECRET_KEY: 'CI-only-vT6Zx9qnP3Km7Yw2hR4Ld8Fj1Ue5NgC0sQp9Ax2Vk7BWm6'
        run: |
          # W005/W021 are intentional: do not HSTS-claim all *.vercel.app domains.
          python manage.py check --deploy
          python manage.py shell -c "from django.conf import settings; assert settings.SECURE_SSL_REDIRECT is True; assert settings.SECURE_HSTS_SECONDS >= 31536000; assert settings.REST_FRAMEWORK['NUM_PROXIES'] == 1; assert not settings.SECURE_HSTS_INCLUDE_SUBDOMAINS; assert not settings.SECURE_HSTS_PRELOAD; print('Vercel HTTPS/HSTS/trusted-proxy policy verified')"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # google-services.json is a public Firebase *client* config, not a service account key.
      # This test project tracks it so PR builds can verify FCM wiring end-to-end.
      - name: Verify Firebase Android config and enable FCM build
        run: |
          if [ -f android/app/google-services.json ]; then
            node -e '
              const fs = require("node:fs");
              const cfg = JSON.parse(fs.readFileSync("android/app/google-services.json", "utf8"));
              const valid = cfg.project_info?.project_id === "pomak-rs"
                && cfg.client?.some(c => c.client_info?.android_client_info?.package_name === "rs.pomak.app");
              if (!valid) throw Error("Firebase config does not match the Pomak project and Android package");
              console.log("Pomak Firebase Android client configuration verified");
            '
            echo 'VITE_FCM_ENABLED=1' >> "$GITHUB_ENV"
          else
            echo 'Firebase config missing; Android FCM remains disabled'
          fi
      - run: npm run build
      - name: Verify Secure Storage native wiring
        run: |
          npx cap sync android
          git diff --exit-code -- android/capacitor.settings.gradle android/app/capacitor.build.gradle
      - name: Build Android debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload Android debug APK for device testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pomak-android-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  production-smoke:
    name: Verify deployed production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend, backend, android]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Wait for matching Vercel web release and smoke API availability
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node frontend/scripts/check-production.mjs
