name: POMAK CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Keep the newest PR verification; do not cancel production/main checks.
concurrency:
  group: pomak-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (Node 24)
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Oxlint (no warnings allowed)
        run: npm run lint -- --deny-warnings
      - run: npm run build
      - name: Verify checked-in Capacitor native plugin wiring
        run: |
          npx cap sync android
          git diff --exit-code -- android/capacitor.settings.gradle android/app/capacitor.build.gradle
      - name: Audit production dependencies (must remain free of moderate+ advisories)
        run: npm audit --omit=dev --audit-level=moderate
      - name: List development dependency advisories (informational)
        run: |
          npm audit --json > audit.json || true
          node -e 'const d=require("./audit.json"); for (const [name,v] of Object.entries(d.vulnerabilities||{})) console.log(name+" "+v.severity+" range="+v.range+" fix="+JSON.stringify(v.fixAvailable)); console.log("Totals:",JSON.stringify(d.metadata?.vulnerabilities||{}));'
        continue-on-error: true
      - name: Chromium offline PWA navigation smoke
        run: |
          # Install the test-only browser driver in isolation. Running npm install
          # in the app root would re-resolve unrelated dev dependencies and can
          # fail for transient/withdrawn tarballs (e.g. oxlint), despite npm ci passing.
          mkdir -p "$RUNNER_TEMP/pomak-playwright"
          npm install --prefix "$RUNNER_TEMP/pomak-playwright" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          ln -s "$RUNNER_TEMP/pomak-playwright/node_modules/playwright" node_modules/playwright
          CHROME_PATH="$(command -v google-chrome)" node scripts/pwa-offline-smoke.mjs

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pomak
          POSTGRES_PASSWORD: pomak_ci_only
          POSTGRES_DB: pomak_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pomak -d pomak_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: github-actions-ci-not-production-secret
      DEBUG: 'False'
      ALLOWED_HOSTS: testserver,localhost
      DATABASE_URL: postgres://pomak:pomak_ci_only@localhost:5432/pomak_ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (Node 24)
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Validate Vercel HTTPS, HSTS and trusted proxy policy
        env:
          VERCEL: '1'
          # This is a CI-only key; actual production secret stays in Vercel.
          SECRET_KEY: 'CI-only-vT6Zx9qnP3Km7Yw2hR4Ld8Fj1Ue5NgC0sQp9Ax2Vk7BWm6'
        run: |
          # W005/W021 are intentional: do not HSTS-claim all *.vercel.app domains.
          python manage.py check --deploy
          python manage.py shell -c "from django.conf import settings; assert settings.SECURE_SSL_REDIRECT is True; assert settings.SECURE_HSTS_SECONDS >= 31536000; assert settings.REST_FRAMEWORK['NUM_PROXIES'] == 1; assert not settings.SECURE_HSTS_INCLUDE_SUBDOMAINS; assert not settings.SECURE_HSTS_PRELOAD; print('Vercel HTTPS/HSTS/trusted-proxy policy verified')"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (Node 24)
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6 (Node 24)
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # Never expose repository secrets to PR code. The trusted main build
      # installs Firebase client config at build time, while PR builds remain
      # functional without FCM until code is reviewed and merged.
      - name: Configure Firebase for production Android build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo 'ANDROID_GOOGLE_SERVICES_JSON secret is not set; FCM disabled'
            exit 0
          fi
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e '
            const fs = require("node:fs");
            const cfg = JSON.parse(fs.readFileSync("android/app/google-services.json", "utf8"));
            const valid = cfg.project_info?.project_id === "pomak-rs"
              && cfg.client?.some(c => c.client_info?.android_client_info?.package_name === "rs.pomak.app");
            if (!valid) throw Error("Firebase configuration does not match Pomak");
            console.log("Firebase client configuration verified");
          '
          echo 'VITE_FCM_ENABLED=1' >> "$GITHUB_ENV"
      - run: npm run build
      - name: Verify Secure Storage native wiring
        run: |
          npx cap sync android
          git diff --exit-code -- android/capacitor.settings.gradle android/app/capacitor.build.gradle
      - name: Build Android debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload Android debug APK for device testing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node 24)
        with:
          name: pomak-android-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # Fail closed: Vercel's Git auto-deploy is disabled for BOTH projects, so a new
  # code release cannot outrun its database migration. This job runs only after
  # all reviewable tests pass on the trusted main branch.
  deploy-production:
    name: Migrate Neon before deploying Vercel
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [frontend, backend, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    concurrency:
      group: pomak-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (Node 24)
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (Node 24)
        with:
          node-version: '24'

      - name: Validate production release credentials before any changes
        env:
          DATABASE_URL: ${{ secrets.NEON_MIGRATE_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "::error::Set NEON_MIGRATE_DATABASE_URL in the GitHub production environment"; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "::error::Set VERCEL_TOKEN in the GitHub production environment"; exit 1; }
          case "$DATABASE_URL" in postgres://*|postgresql://*) ;; *) echo "::error::Migration DATABASE_URL must be PostgreSQL"; exit 1 ;; esac

      - name: Apply production migrations while old API is still live
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_MIGRATE_DATABASE_URL }}
          SECRET_KEY: 'ci-release-migration-only-not-a-production-Django-secret'
          DEBUG: 'False'
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py migrate --check
          echo 'Production database schema is ready BEFORE publishing new API code.'

      - name: Install reviewed Vercel CLI
        run: npm install --global vercel@65.14.0

      - name: Build and publish API (after migration)
        # Vercel project Root Directory is already "backend"; running CLI from
        # backend/ would resolve backend/backend and fail with ENOENT.
        # Remote builds receive real production secrets, not the "[SENSITIVE]"
        # placeholders emitted by "vercel pull" for local prebuilt builds.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_wN38hTjntiW7tRc4nDnkEg9b
          VERCEL_PROJECT_ID: prj_R4hPN0ydMOsyGiLdJmgWpHdYGPzz
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production
          vercel deploy --prod --yes --logs
          echo 'New API version published only after the database schema update.'

      - name: Check new production API before publishing web
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request
          for endpoint in ('health', 'ready'):
              url = 'https://pomak-api.vercel.app/api/' + endpoint + '/'
              with urllib.request.urlopen(url, timeout=15) as response:
                  data = json.load(response)
                  assert response.status == 200 and data.get('status') == 'ok', (url, data)
              print('Verified', url)
          PY

      - name: Build and publish web against the migrated API
        # The linked Vercel project already specifies "frontend" as Root Directory.
        # Send the exact reviewed SHA into the remote build for build.json smoke.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_wN38hTjntiW7tRc4nDnkEg9b
          VERCEL_PROJECT_ID: prj_pnav9q8DWjDkHvN1C7Mx9UJn1aHI
          POMAK_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production
          vercel deploy --prod --yes --logs --build-env "POMAK_RELEASE_SHA=$POMAK_RELEASE_SHA"

  production-smoke:
    name: Verify deployed production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend, backend, android, deploy-production]
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (Node 24)
        with:
          node-version: '24'
      - name: Wait for matching Vercel web release and smoke API availability
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node frontend/scripts/check-production.mjs
