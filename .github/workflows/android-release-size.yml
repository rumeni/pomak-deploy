name: Android release size audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/android/app/build.gradle'
      - '.github/workflows/android-release-size.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-size:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - name: Generate Android native plugin wiring
        run: npx cap sync android
      - name: Compile both debug and optimized unsigned release APKs
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Compare APK sizes
        run: |
          set -euo pipefail
          debug=android/app/build/outputs/apk/debug/app-debug.apk
          release=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$debug"
          test -s "$release"
          debug_bytes=$(stat -c '%s' "$debug")
          release_bytes=$(stat -c '%s' "$release")
          python - "$debug_bytes" "$release_bytes" <<'PY'
          import sys
          from pathlib import Path

          debug, release = map(int, sys.argv[1:])
          summary = (
              '### Android package size audit (unsigned release)\n'
              f'- Debug: {debug:,} bytes ({debug / 1e6:.2f} MB)\n'
              f'- R8 release: {release:,} bytes ({release / 1e6:.2f} MB)\n'
              f'- Difference: {(debug - release) / 1e6:.2f} MB ({(debug - release) / debug:.1%})\n'
              '\nAn unsigned release APK passing compilation does not establish on-device compatibility.\n'
          )
          print(summary)
          with Path(sys.argv[0]).parent.joinpath('android-size-audit.txt').open('w') as output:
              output.write(summary)
          PY
          cat android-size-audit.txt >> "$GITHUB_STEP_SUMMARY"
