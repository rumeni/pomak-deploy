name: POMAK dependency remediation (temporary)
on:
  pull_request:
    branches: [main]

jobs:
  safe-fix:
    # This temporary helper is restricted to our own audit-fix branch.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/pomak-audit-2026-11-15'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update packages within existing version ranges
        working-directory: frontend
        run: |
          npm ci
          npm audit fix || true
          npm ci
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit checked updates to the existing PR branch
        run: |
          if git diff --quiet -- frontend/package-lock.json frontend/package.json; then
            echo 'Already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json frontend/package.json
          git commit -m 'Update npm dependencies to address audit advisories'
          git push origin HEAD:refs/heads/fix/pomak-audit-2026-11-15
