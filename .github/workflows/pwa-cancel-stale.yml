name: Cancel superseded PWA trial runners (temporary)
on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/pwa-audit-workbox-2026-11-15'
    runs-on: ubuntu-latest
    steps:
      - name: Stop three obsolete Chromium trials that retained child processes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for id in 43706584420 43707217741 43707377432; do
            code=$(curl -sS -o /tmp/cancel.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$id/cancel")
            echo "Cancel old run $id: HTTP $code"
            cat /tmp/cancel.json
            if [ "$code" != "202" ] && [ "$code" != "409" ]; then exit 1; fi
          done
